name: "CD — Mobile Multi-Environment Build & Release (Android & iOS)"

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - dev
          - staging
          - prod
      app_version:
        description: "Semantic version (e.g. 1.2.0)"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: write

jobs:
  # ============================================================================
  # STAGE 1: Pre-Release Quality Gate
  # ============================================================================
  verify:
    name: "1. Quality Gate (Analyze & Test)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

  # ============================================================================
  # STAGE 2: Build Signed Android APK & AppBundle (AAB)
  # ============================================================================
  build-android:
    name: "2. Build Android Release (APK + AAB)"
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v5

      - name: "Setup Java 17 (with Gradle Cache)"
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: "Setup Flutter SDK"
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: "Resolve Build Metadata & Environment"
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            APP_ENV="${{ inputs.environment }}"
            APP_VERSION="${{ inputs.app_version }}"
          else
            APP_ENV="prod"
            APP_VERSION="${GITHUB_REF_NAME#v}"
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "app_env=${APP_ENV}" >> $GITHUB_OUTPUT
          echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: "Configure Android Release Keystore (from GitHub Secrets)"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "🔐 Decoding production Android Keystore from GitHub Secrets..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          else
            echo "ℹ️ No ANDROID_KEYSTORE_BASE64 secret configured; using fallback signing config."
          fi

      - name: "Build Release APK with --dart-define"
        run: |
          flutter build apk --release \
            --build-name=${{ steps.meta.outputs.app_version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_ENV=${{ steps.meta.outputs.app_env }} \
            --dart-define=APP_VERSION=${{ steps.meta.outputs.app_version }} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=GIT_COMMIT=${{ steps.meta.outputs.short_sha }}

      - name: "Build Release AppBundle (AAB) for Google Play"
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.meta.outputs.app_version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_ENV=${{ steps.meta.outputs.app_env }} \
            --dart-define=APP_VERSION=${{ steps.meta.outputs.app_version }} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=GIT_COMMIT=${{ steps.meta.outputs.short_sha }}

      - name: "Prepare Release Artifacts"
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/relay-mobile-${{ steps.meta.outputs.app_env }}-v${{ steps.meta.outputs.app_version }}.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/relay-mobile-${{ steps.meta.outputs.app_env }}-v${{ steps.meta.outputs.app_version }}.aab
          ls -lh dist/

      - name: "Upload Android Release Artifacts (APK + AAB)"
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.meta.outputs.app_env }}
          path: dist/*
          if-no-files-found: error

  # ============================================================================
  # STAGE 3: Build iOS Release Archive (macOS Runner)
  # ============================================================================
  build-ios:
    name: "3. Build iOS Release Archive"
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: "Build iOS Release with --dart-define"
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          APP_ENV="${{ inputs.environment || 'prod' }}"
          APP_VERSION="${{ inputs.app_version || '1.0.0' }}"
          flutter build ios --release --no-codesign \
            --build-name=${APP_VERSION} \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_ENV=${APP_ENV} \
            --dart-define=APP_VERSION=${APP_VERSION} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=GIT_COMMIT=${SHORT_SHA}

  # ============================================================================
  # STAGE 4: Publish Release & Distribute Mobile Artifacts
  # ============================================================================
  publish-release:
    name: "4. Publish GitHub Release & Store Distribution"
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: "Download Built Android Artifacts"
        uses: actions/download-artifact@v4
        with:
          name: android-release-prod
          path: release-artifacts

      - name: "Create GitHub Release with APK & AAB"
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/*.apk
            release-artifacts/*.aab

      # ------------------------------------------------------------------------
      # PRODUCTION STORE EXTENSIONS (Ready to enable when store accounts exist)
      # ------------------------------------------------------------------------
      # - name: "Distribute to Firebase App Distribution (QA Testers)"
      #   uses: wzieba/Firebase-Distribution-Github-Action@v1
      #   with:
      #     appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
      #     serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      #     groups: qa-team
      #     file: release-artifacts/build/app/outputs/flutter-apk/app-release.apk
